name: Build with Maven

on:
  push:
  pull_request:

jobs:
  build:
    name: Run Maven build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '18'

      - name: Run tests
        run: mvn clean test
